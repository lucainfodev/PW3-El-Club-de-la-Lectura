<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 120" width="100%" height="100%">
  <defs>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E3A8A" />
      <stop offset="100%" stop-color="#3B82F6" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="1" dy="2" stdDeviation="2" flood-opacity="0.15" />
    </filter>
  </defs>

  <!-- Isotipo: Libro abierto + Círculo del Club -->
  <g transform="translate(20, 15)">
    <!-- Círculo de fondo suave -->
    <circle cx="45" cy="45" r="42" fill="#EFF6FF" />

    <!-- Páginas del libro -->
    <path d="M45 68 C35 60 18 60 15 62 L15 32 C20 30 35 30 45 38 Z" fill="url(#primaryGrad)" filter="url(#shadow)" />
    <path d="M45 68 C55 60 72 60 75 62 L75 32 C70 30 55 30 45 38 Z" fill="url(#primaryGrad)" filter="url(#shadow)" />

    <!-- Líneas internas de páginas -->
    <path d="M43 64 C35 57 22 57 19 59 L19 36 C24 34 35 34 43 41 Z" fill="#FFFFFF" opacity="0.9" />
    <path d="M47 64 C55 57 68 57 71 59 L71 36 C66 34 55 34 47 41 Z" fill="#FFFFFF" opacity="0.9" />

    <!-- Marca páginas dorado -->
    <path d="M43 25 L47 25 L47 48 L45 45 L43 48 Z" fill="url(#goldGrad)" />

    <!-- Arco superior de comunidad / membresía -->
    <path d="M26 18 A 38 38 0 0 1 64 18" fill="none" stroke="url(#goldGrad)" stroke-width="3" stroke-linecap="round" />
  </g>

  <!-- Tipografía -->
  <g transform="translate(130, 0)">
    <!-- Subtítulo superior -->
    <text x="0" y="42" font-family="system-ui, -apple-system, &#39;Segoe UI&#39;, Roboto, sans-serif" font-size="13" font-weight="700" letter-spacing="5" fill="#D97706">
      EL CLUB DE LA
    </text>

    <!-- Título principal -->
    <text x="0" y="82" font-family="Georgia, Cambria, &#39;Times New Roman&#39;, serif" font-size="44" font-weight="bold" letter-spacing="1" fill="#1E3A8A">
      Lectura
    </text>

    <!-- Detalle decorativo inferior -->
    <line x1="0" y1="94" x2="160" y2="94" stroke="#3B82F6" stroke-width="2.5" stroke-linecap="round" />
    <circle cx="170" cy="94" r="2.5" fill="#D97706" />
  </g>
</svg>